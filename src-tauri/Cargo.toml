[package]
name = "z-monitor"
version = "0.1.0"
description = "A local macOS system monitor"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api"] }
serde_json = "1"
window-vibrancy = "0.6"

[profile.release]
strip = true
lto = true
codegen-units = 1
